<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#4a1d2a" />
  <title>Mesai — Haftalık</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e7e0d4'/%3E%3Crect x='8' y='7' width='16' height='16' rx='2' fill='%23ffe15a' transform='rotate(-8 16 16)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,700;1,7..72,560&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-mesai is-locked" data-theme="bordo">
  <div class="gate" id="gate">
    <form class="gate-card" id="gate-form" autocomplete="on">
      <p class="mast-kicker">Haftalık</p>
      <h1 class="gate-title">Giriş</h1>
      <label>E-posta
        <input name="email" type="email" autocomplete="username" required />
      </label>
      <label>Şifre
        <input name="password" type="password" autocomplete="current-password" required />
      </label>
      <p class="gate-error" id="gate-error" hidden></p>
      <button type="submit" class="primary">Giriş yap</button>
    </form>
  </div>
  <a class="skip" href="#mesai-form">Mesai ekle</a>
  <div class="desk">
    <header class="topbar">
      <a class="brand brand-link" href="index.html">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <p class="word">haftalık</p>
          <p class="tag">mesai defteri</p>
        </div>
      </a>
      <div class="spacer"></div>
      <p id="who" class="who" hidden></p>
      <button type="button" class="ghost" id="logout-btn" hidden>Çıkış</button>
      <div class="themes" role="group" aria-label="Renk ayarı">
        <button type="button" class="theme-dot" data-theme="bordo" aria-label="Bordo"></button>
        <button type="button" class="theme-dot" data-theme="lacivert" aria-label="Lacivert"></button>
        <button type="button" class="theme-dot" data-theme="beyaz" aria-label="Beyaz"></button>
        <button type="button" class="theme-dot" data-theme="koyu" aria-label="Koyu"></button>
      </div>
      <a class="ghost" href="index.html">Takvim</a>
      <button type="button" class="primary" id="export-xlsx">Excel’e aktar</button>
    </header>

    <main class="mesai-wrap">
      <section class="sheet mesai-sheet" aria-label="Mesai kayıtları">
        <header class="mast">
          <span class="rings" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <div>
            <p class="mast-kicker">Yan sayfa</p>
            <h2 class="mast-title">Mesai defteri</h2>
          </div>
        </header>

        <form id="mesai-form" class="mesai-form" autocomplete="off">
          <label>İsim
            <input name="name" maxlength="80" required placeholder="Ad soyad" />
          </label>
          <label>Tarih
            <input name="date" type="date" required />
          </label>
          <label>Başlangıç
            <input name="start" type="time" required />
          </label>
          <label>Bitiş
            <input name="end" type="time" required />
          </label>
          <label>Süre
            <input name="hours" type="number" min="0.25" max="24" step="0.25" required readonly />
          </label>
          <label>Ne iş yapıldı
            <textarea name="note" maxlength="800" rows="2" placeholder="Kısa iş notu"></textarea>
          </label>
          <button type="submit" class="primary" id="save-btn">Ekle</button>
        </form>
        <p class="mesai-sum" id="mesai-sum"></p>
        <div id="mesai-list"></div>
      </section>
    </main>
  </div>
  <script src="auth.js"></script>
  <script src="mesai.js"></script>
</body>
</html>
